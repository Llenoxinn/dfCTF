name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: dfctf_test
          POSTGRES_USER: dfctf_test
          POSTGRES_PASSWORD: dfctf_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dfctf_test -d dfctf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - name: PostgreSQL competition and database access tests
        run: npx vitest run tests/competitions.test.ts
        env:
          TEST_DATABASE_URL: postgres://dfctf_test:dfctf_ci_test@127.0.0.1:5432/dfctf_test
      - name: PostgreSQL draft artifact removal tests
        run: npx vitest run tests/artifacts.test.ts
        env:
          TEST_DATABASE_URL: postgres://dfctf_test:dfctf_ci_test@127.0.0.1:5432/dfctf_test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:integration
